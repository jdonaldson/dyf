<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dyf - Density-based Classification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        h1 span { color: #4ECDC4; }
        .tagline {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 2rem;
        }
        .demo-link {
            display: inline-block;
            background: linear-gradient(135deg, #4ECDC4, #45B7D1);
            color: #1a1a1a;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .demo-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(78, 205, 196, 0.3);
        }
        .preview {
            max-width: 900px;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
        }
        .preview img {
            width: 100%;
            display: block;
        }
        .links {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .links a {
            color: #4ECDC4;
            text-decoration: none;
            font-size: 1rem;
        }
        .links a:hover { text-decoration: underline; }
        footer {
            margin-top: auto;
            padding-top: 2rem;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h1><span>dyf</span></h1>
    <p class="tagline">Density-based classification with LSH</p>

    <a href="wiki_visualization.html" class="demo-link">Explore Interactive Demo</a>

    <div class="preview">
        <a href="wiki_visualization.html">
            <img src="wiki_knowledge_graph.png" alt="Wikipedia Knowledge Graph visualization">
        </a>
    </div>

    <div class="links">
        <a href="https://github.com/jdonaldson/dyf">GitHub</a>
        <a href="https://pypi.org/project/dyf/">PyPI</a>
    </div>

    <footer>
        Built with dyf - fast density estimation using locality-sensitive hashing
    </footer>
</body>
</html>
