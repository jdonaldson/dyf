[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dyf"
version = "0.13.0"
description = "Density Yields Features - discover structure in embedding spaces"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Justin Donaldson", email = "jdonaldson@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["outlier", "classification", "lsh", "pca", "embeddings", "machine-learning"]
dependencies = [
    "numpy>=1.20",
    "dyf-rs>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyarrow>=10.0",
    "requests>=2.28",
    "ruff>=0.15,<0.16",
]
full = [
    "pyarrow>=10.0",
    "polars>=0.19",
    "pandas>=1.5",
    "scikit-learn>=1.0",
    "sentence-transformers>=2.2",
    "openai>=1.0",
]
io = [
    "safetensors>=0.4",
]
lazy = [
    "pyarrow>=10.0",
    "flatbuffers>=24.0",
]
viz = [
    "panel>=1.3",
    "holoviews>=1.18",
    "datashader>=0.16",
    "bokeh>=3.3",
    "umap-learn>=0.5",
    "polars>=0.19",
    "pandas>=1.5",
]
mcp = [
    "mcp>=1.0",
]
source = [
    "requests>=2.28",
    "tree-sitter-language-pack>=0.4",
]
vision = [
    "transformers>=4.36",
    "Pillow>=9.0",
    "torch>=2.0",
]
video = [
    "scenedetect[opencv]>=0.6",
    "transformers>=4.36",
    "Pillow>=9.0",
    "torch>=2.0",
]
# NOTE: the `enrich` extra moved to the dyfviz package on 2026-09-05, along with the
# code that used it. Install `dyfviz[all]` for UMAP projection, clustering, narration
# and the browser tour.
concepts = [
    "scikit-learn>=1.0",
    "sentence-transformers>=2.2",
]

[project.scripts]
dyf = "dyf.cli:main"

[project.urls]
Homepage = "https://dyf.io"
Documentation = "https://dyf.io"
Repository = "https://github.com/jdonaldson/dyf"
Issues = "https://github.com/jdonaldson/dyf/issues"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "E402",   # module-import-not-at-top (intentional lazy imports)
    "E741",   # ambiguous variable name (l, O, I in comprehensions)
    "B007",   # unused-loop-control-variable (intentional _ patterns)
    "B904",   # raise-without-from-inside-except
    "B905",   # zip-without-explicit-strict
    "SIM102", # collapsible-if (readability preference)
    "SIM108", # if-else-block-instead-of-if-exp (readability preference)
    "SIM110", # reimplemented-builtin
    "SIM113", # enumerate-for-loop
    "SIM115", # open-file-with-context-handler
]

[tool.ruff.lint.isort]
known-first-party = ["dyf"]

[tool.setuptools.packages.find]
where = ["src"]
