[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dyf"
version = "0.8.0"
description = "Density Yields Features - discover structure in embedding spaces"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Justin Donaldson", email = "jdonaldson@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["outlier", "classification", "lsh", "pca", "embeddings", "machine-learning"]
dependencies = [
    "numpy>=1.20",
    "dyf-rs>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyarrow>=10.0",
]
full = [
    "pyarrow>=10.0",
    "polars>=0.19",
    "pandas>=1.5",
    "scikit-learn>=1.0",
    "sentence-transformers>=2.2",
    "openai>=1.0",
]
io = [
    "safetensors>=0.4",
]
lazy = [
    "pyarrow>=10.0",
    "flatbuffers>=24.0",
]
viz = [
    "panel>=1.3",
    "holoviews>=1.18",
    "datashader>=0.16",
    "bokeh>=3.3",
    "umap-learn>=0.5",
    "polars>=0.19",
    "pandas>=1.5",
]
mcp = [
    "mcp>=1.0",
]
source = [
    "tree-sitter-language-pack>=0.4",
]
vision = [
    "transformers>=4.36",
    "Pillow>=9.0",
    "torch>=2.0",
]
video = [
    "scenedetect[opencv]>=0.6",
    "transformers>=4.36",
    "Pillow>=9.0",
    "torch>=2.0",
]
enrich = [
    "umap-learn>=0.5",
    "scikit-learn>=1.0",
    "datashader>=0.16",
    "pandas>=1.5",
    "pyarrow>=10.0",
    "flatbuffers>=24.0",
    "tornado>=6.0",
]
concepts = [
    "scikit-learn>=1.0",
    "sentence-transformers>=2.2",
]

[project.scripts]
dyf = "dyf.cli:main"

[project.urls]
Homepage = "https://dyf.io"
Documentation = "https://dyf.io"
Repository = "https://github.com/jdonaldson/dyf"
Issues = "https://github.com/jdonaldson/dyf/issues"

[tool.setuptools.packages.find]
where = ["src"]
