project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    # Served verbatim at https://dyf.io/llms.txt. Must be listed here — Quarto only
    # copies non-.qmd files into _site if they are declared as resources, so without
    # this the file exists in the repo and 404s on the site.
    - llms.txt
    - gallery/cifar100-deck/
    - gallery/cifar100-deck-thumb.jpg

# Freeze computational pages: render locally, commit _freeze/, and CI (quarto basics,
# no heavy deps) just assembles the stored output instead of re-executing the cells.
execute:
  freeze: auto

metadata-files:
  - reference/_sidebar.yml

website:
  title: ""
  google-analytics: "G-QXBFEQPED2"
  navbar:
    logo: dyf_logo.svg
    logo-alt: "DYF"
    left:
      - href: index.qmd
        text: Home
      - href: getting-started.qmd
        text: Getting Started
      - href: how-it-works.qmd
        text: How It Works
      - href: gallery/index.qmd
        text: Gallery
      - href: reference/index.qmd
        text: API Reference
    right:
      - icon: github
        href: https://github.com/jdonaldson/dyf

format:
  html:
    theme:
      light:
        - cosmo
        - custom.scss
      dark:
        - darkly
        - custom-dark.scss
    highlight-style:
      light: kate
      dark: zenburn
    toc: true

quartodoc:
  package: dyf
  dir: reference
  title: API Reference
  parser: google
  style: pkgdown
  dynamic: true
  render_interlinks: true
  sidebar: "reference/_sidebar.yml"
  sections:
    - title: Core
      desc: >
        Core density classification and reporting. `DensityClassifierFull` wraps
        the Rust-accelerated core with embedding generation, DataFrame I/O, and
        LLM-based labeling.
      contents:
        - DensityClassifierFull

    - title: Tree Methods
      desc: Hierarchical tree construction for multi-resolution analysis of embeddings.
      contents:
        - cut_tree_to_labels
        - extract_boundary_persistence
        - boundary_persistence_scores
        - build_dyf_tree
        - refine_dyf_tree
        - refine_clusters

    - title: Retrieval (RAG)
      desc: Bridge-aware retrieval, anchor selection, and ontology construction.
      contents:
        - BridgeIndex
        - find_super_connectors
        - select_orthogonal_anchors
        - diversify_by_facet
        - get_kmeans_init
        - compute_neighbor_diversity
        - compute_hub_score
        - mine_dag_chains
        - build_dag_taxonomy
        - build_unified_ontology
        - build_rog_ontology

    - title: Result Types
      desc: Dataclasses returned by RAG and analysis functions.
      contents:
        - SuperConnectorResult
        - OrthogonalAnchorResult
        - FacetDiverseResult
        - DAGChain
        - DAGMiningResult
        - DAGTaxonomy
        - UnifiedOntologyResult
        - HubScoreResult
        - ROGLayer
        - ROGResult

    - title: Re-ranking
      desc: Re-rank search results with diversity and bridge awareness.
      contents:
        - rerank_standard
        - rerank_mmr
        - rerank_bridge_boost
        - rerank_bridge_mmr

    - title: Chunk Analysis
      desc: Analyze chunk redundancy, document spread, and cluster quality.
      contents:
        - DocSpread
        - chunk_redundancy
        - deduplicate_chunks
        - doc_spread
        - cluster_quality
        - neighbor_coherence

    - title: Lazy Index
      desc: >
        Memory-mapped tree index with FlatBuffers + Arrow IPC. Build indexes
        with `write_lazy_index`, search with `LazyIndex`, and use adaptive
        probing for margin-aware probe counts.
      contents:
        - LazyIndex
        - write_lazy_index
        - rewrite_lazy_index
        - split_dyf3
        - from_faiss
        - SearchResult
        - AdaptiveProbeConfig

    - title: Fisher Weighting
      desc: Per-dimension Fisher ratio weighting for supervised embedding refinement.
      contents:
        - compute_fisher_weights
        - apply_fisher_weights

    - title: Split Keywords
      desc: >
        TF-IDF keyword extraction from DYF tree splits. Each PCA split naturally
        separates vocabularies — these functions extract discriminative terms per
        split side without LLM calls.
      contents:
        - compute_split_keywords
        - compute_embedding_keywords
        - label_clusters_frequency
        - build_tree_maps
        - collect_descendant_indices
        - compute_domain_stopwords
        - format_split_path
        - tokenize
        - TextDiversityReport
        - assess_text_diversity

    - title: Cluster Tree
      desc: Connect BIRCH spatial clusters to DYF tree nodes for deterministic cluster naming.
      contents:
        - build_cluster_tree_dag
        - compute_sibling_keywords
        - derive_path_labels
        - format_cluster_context

    - title: Agglomeration
      desc: Merge DYF tree leaves into coarser groups via linkage or community detection.
      contents:
        - agglomerate_tree_leaves
        - louvain_cluster_leaves
        - merge_to_max_k

    - title: Categorical
      desc: Hierarchical taxonomy graphs, label coarsening, and multi-level Fisher weighting.
      contents:
        - CategoryGraph
        - coarsen
        - multi_level_fisher_weights
        - store_category_graph
        - load_category_graphs
        - AxisDiagnostic
        - diagnose_axes
        - diagnostics_to_metadata
        - discover_categorical_columns
        - embed_with_diagnostics

    - title: Colors
      desc: Deterministic color assignment for spatial clusters.
      contents:
        - spatial_rgb_map
        - spatial_color_map
        - tree_rgb_map

    - title: Provenance
      desc: Artifact identity fingerprinting for DAG-oriented pipelines.
      contents:
        - Provenance
        - create_provenance
        - file_hash
        - params_hash
        - check_compatible
        - provenance_to_dict
        - provenance_from_dict

    - title: Configuration
      desc: Pre-built configurations for embedding models and LLM labelers.
      contents:
        - EmbedderConfig
        - LabelerConfig
        - list_configs
