name: Publish Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/dyf/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install package
        run: pip install -e ".[dev,full,io,lazy,viz]"

      - name: Install gallery render dependencies
        # Jupyter stack (Quarto executes the python .qmd cells) + render-time imports
        # the gallery pages use that aren't in the package extras.
        run: pip install jupyter datasets matplotlib plotly ripser scanpy hdbscan

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish
        run: quarto publish gh-pages docs --no-prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
